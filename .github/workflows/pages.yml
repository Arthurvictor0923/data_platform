name: Deploy GitHub Pages

# 推送到 main 时自动组装并发布站点；也可在 Actions 面板手动触发
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个发布任务，避免并发发布互相覆盖
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 组装站点并发布
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 组装静态站点
        run: python publish/build_site.py --out _site

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # 同步 gh-pages 备用分支：即使日后关闭 Actions，站点仍可切回「从分支部署」
      - name: 同步 gh-pages 备用分支
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages origin/gh-pages
          rm -rf -- index.html screenshots
          cp -r _site/. .
          git add index.html screenshots
          git commit -q -m "chore: 同步站点快照 ${GITHUB_SHA::8}" || echo "内容无变化，跳过提交"
          git push origin gh-pages

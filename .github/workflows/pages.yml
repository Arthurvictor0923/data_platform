name: Deploy GitHub Pages

# 推送到 main 时自动组装并发布站点；也可在 Actions 面板手动触发
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布任务，避免并发发布互相覆盖
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 组装站点并发布
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 组装静态站点
        run: python publish/build_site.py --out _site

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

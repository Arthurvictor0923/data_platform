<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(n,cls='')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
let catalogs,nodes,assets,currentNode='infra',mainPage=1,mainSize=10,highlighted=new Set(),copyState=null,toastTimer,lastFocus=null,secondaryReturn=null;
const expanded=new Set(['resource','infra','natural','remote','business','contract']);
function resetData(){
 catalogs=[
  {id:'assets',name:'资产目录',module:'资产目录',description:'按业务主题组织数据资产',enabled:true},
  {id:'resources',name:'资源目录',module:'资源目录',description:'用于数据资源的清查盘点',enabled:true},
  {id:'sources',name:'数据源目录',module:'—',description:'',enabled:true}
 ];
 nodes=[{id:'resource',name:'资源资产',parent:null},{id:'water',name:'水利工程',parent:'resource'},{id:'infra',name:'农业基础设施',parent:'resource'},{id:'yard',name:'晒场',parent:'infra'},{id:'store',name:'仓储',parent:'infra'},{id:'dryer',name:'烘干塔',parent:'infra'},{id:'natural',name:'自然资源',parent:'resource'},{id:'land',name:'耕地',parent:'natural'},{id:'remote',name:'农业遥感',parent:'resource'},{id:'interpret',name:'遥感解译',parent:'remote'},{id:'satellite',name:'卫星',parent:'remote'},{id:'business',name:'经营管理',parent:null},{id:'contract',name:'土地承包',parent:'business'},{id:'subsidy',name:'农机补贴',parent:'contract'},{id:'topic',name:'年度专题',parent:null}];
 assets=[];const seedNames=['qxj1','资产基本信息4','test-database-20251215','SAFFA','test-database-20251212','test20251212','M20251211','数据集1208003','数据集1208002','数据集141241243'];
 const owners=['刘金','徐众','夏少冲','晏聪'];
 function add(name,dir,i){const id='asset-'+(assets.length+1);assets.push({id,originId:id,name,directoryId:dir,table:'data_'+dir+'_'+String(i+1).padStart(3,'0'),source:'农业业务数据库',description:name+'相关数据。',published:i%4<2,owner:owners[i%owners.length],publisher:i%4<2?owners[(i+1)%owners.length]:'',publishedAt:i%4<2?'2026-06-'+String(10+i%18).padStart(2,'0')+' 17:33:35':'',apis:i%3,createdAt:'2026-05-13 11:25:05'});}
 for(let i=0;i<19;i++)add(seedNames[i]||['晒场基础信息','晒场面积统计','晒场使用记录','晒场设施台账','晒场分布数据','晒场作业记录','晒场维护记录','晒场设备清单','晒场年度统计'][i-10],'yard',i);
 add('粮食仓储基础信息','store',0);for(let i=0;i<2;i++)add(['烘干塔基础信息','烘干作业台账'][i],'dryer',i);
 for(let i=0;i<11;i++)add(['耕地基础信息','地块承包信息','地块面积统计','作物种植分布','耕地质量记录','土壤采样数据','土地利用现状','高标准农田数据','耕地调查记录','地块边界数据','年度耕地统计'][i],'land',i);
 add('农作物遥感解译成果','interpret',0);for(let i=0;i<3;i++)add(['卫星影像目录','年度遥感影像','遥感影像覆盖范围'][i],'satellite',i);for(let i=0;i<3;i++)add(['农机补贴基础台账','年度农机补贴记录','补贴申请统计'][i],'subsidy',i);
}
function node(id){return nodes.find(n=>n.id===id)}
function descendants(id){let result=[id];for(const n of nodes.filter(n=>n.parent===id))result.push(...descendants(n.id));return result}
function path(id){const n=node(id);return n?(n.parent?path(n.parent)+' / ':'')+n.name:''}
function count(id){const ids=new Set(descendants(id));return assets.filter(a=>ids.has(a.directoryId)).length}
function inNode(id){const ids=new Set(descendants(id));return assets.filter(a=>ids.has(a.directoryId))}
function matches(a,q){return !q||(a.name+' '+a.table).toLowerCase().includes(q.toLowerCase())}
function renderTree(){let html='';function walk(parent,depth){for(const n of nodes.filter(n=>n.parent===parent)){const children=nodes.some(x=>x.parent===n.id);html+=`<div class="tree-row ${n.id===currentNode?'selected':''}" role="treeitem" tabindex="0" aria-selected="${n.id===currentNode}" ${children?`aria-expanded="${expanded.has(n.id)}"`:''} data-node="${n.id}" style="padding-left:${depth*24+5}px"><span class="arrow" data-toggle="${n.id}">${children?(expanded.has(n.id)?'▾':'▸'):''}</span><span class="node-label">${esc(n.name)}<span class="ncount">(${count(n.id)})</span></span></div>`;if(children&&expanded.has(n.id))walk(n.id,depth+1)}}walk(null,0);$('mainTree').innerHTML=html;}
function empty(title,sub=''){return `<div class="empty">${icon('folder')}<strong>${title}</strong>${sub?`<p>${sub}</p>`:''}</div>`}
function pagerHtml(total,page,size,kind){const pages=Math.max(1,Math.ceil(total/size));let nums='';for(let i=Math.max(1,page-1);i<=Math.min(pages,page+2);i++)nums+=`<button class="page-number ${i===page?'active':''}" data-page="${i}" data-kind="${kind}" aria-label="第 ${i} 页">${i}</button>`;return `<span>共 ${total} ${kind==='copy'?'项':'条'}</span><button class="page-number" data-page="${page-1}" data-kind="${kind}" aria-label="上一页" ${page===1?'disabled':''}>${icon('left')}</button>${nums}<button class="page-number" data-page="${page+1}" data-kind="${kind}" aria-label="下一页" ${page===pages?'disabled':''}>${icon('right')}</button><select data-size="${kind}" aria-label="${kind==='copy'?'来源资产':'当前资产'}每页条数">${[5,10,20].map(s=>`<option value="${s}" ${s===size?'selected':''}>${s} 条/页</option>`).join('')}</select>${kind==='main'?'<span class="jump-label">跳至</span><input class="jump" aria-label="跳转页码" inputmode="numeric"><span class="jump-label">页</span>':''}`}
function renderMain(){renderDirectoryHeading();renderTree();let list=inNode(currentNode).filter(a=>matches(a,$('assetSearch').value));mainPage=Math.max(1,Math.min(mainPage,Math.ceil(list.length/mainSize)||1));const shown=list.slice((mainPage-1)*mainSize,mainPage*mainSize);$('mainTableArea').innerHTML=shown.length?`<table class="main-table"><thead><tr><th>资产名称</th><th>是否上架</th><th>添加人</th><th>上架人</th><th>API个数</th><th>上架时间</th><th>操作</th></tr></thead><tbody>${shown.map(a=>`<tr class="${highlighted.has(a.id)?'row-added':''}"><td title="${esc(a.name)}">${esc(a.name)}</td><td class="${a.published?'published':'unpublished'}">${a.published?'已上架':'未上架'}</td><td>${esc(a.owner)}</td><td>${esc(a.publisher)||'-'}</td><td>${a.apis}</td><td>${esc(a.publishedAt)||'-'}</td><td><div class="ops"><button class="link" data-act="publish" data-id="${a.id}">${a.published?'下架':'上架'}</button><button class="link" data-act="api" data-id="${a.id}" ${a.apis===0?'disabled':''}>API管理</button><button class="link" data-act="detail" data-id="${a.id}">详情</button><button class="link danger" data-act="delete" data-id="${a.id}" ${a.published?'disabled':''}>删除</button></div></td></tr>`).join('')}</tbody></table>`:empty($('assetSearch').value?'没有找到匹配的资产':'当前目录暂无资产',$('assetSearch').value?'请调整搜索关键词':'可添加资产，或从其他目录复制资产');$('mainPager').innerHTML=pagerHtml(list.length,mainPage,mainSize,'main');}
function selectNode(id){currentNode=id;mainPage=1;$('assetSearch').value='';renderMain()}
function toast(message,info=false){clearTimeout(toastTimer);$('toastContainer').innerHTML=`<div class="toast ${info?'info':''}">${icon(info?'info':'check')}<span>${esc(message)}</span></div>`;toastTimer=setTimeout(()=>$('toastContainer').innerHTML='',3500)}
function showCopy(){lastFocus=document.activeElement;copyState={target:currentNode,source:null,page:1,size:5,selected:new Set(),busy:false};$('targetPath').textContent=path(currentNode);$('sourceTrigger').innerHTML='<span class="placeholder">请选择来源目录</span>'+icon('down');$('copySearch').value='';$('copySearch').disabled=true;$('sourceSearch').value='';$('confirmCopy').innerHTML='复制选中资产';$('copyOverlay').hidden=false;document.body.style.overflow='hidden';setSourceOpen(false);renderCopy();$('sourceTrigger').focus()}
function hideCopy(){if(copyState?.busy)return;$('copyOverlay').hidden=true;setSourceOpen(false);copyState=null;document.body.style.overflow='';lastFocus?.focus()}
function setSourceOpen(open){$('sourcePopover').hidden=!open;$('sourceTrigger').classList.toggle('open',open);$('sourceTrigger').setAttribute('aria-expanded',String(open));if(open){renderSource();$('sourceSearch').focus()}}
function renderSource(){if(!copyState)return;const q=$('sourceSearch').value.trim().toLowerCase();let html='';function walk(parent,depth){for(const n of nodes.filter(n=>n.parent===parent)){if(q&&!path(n.id).toLowerCase().includes(q)&&!descendants(n.id).some(id=>node(id).name.toLowerCase().includes(q)))continue;html+=`<button class="source-option ${copyState.source===n.id?'selected':''}" role="treeitem" style="padding-left:${depth*22+9}px" data-source="${n.id}" ${n.id===copyState.target?'disabled':''}>${icon('folder')}<span>${esc(n.name)}</span><span>${n.id===copyState.target?'当前目标':count(n.id)}</span></button>`;walk(n.id,depth+1)}}walk(null,0);$('sourceOptions').innerHTML=html||'<div class="no-options">没有找到匹配的目录</div>'}
function sourceSelect(id){if(!copyState||id===copyState.target)return;copyState.source=id;copyState.page=1;copyState.selected.clear();$('copySearch').value='';$('copySearch').disabled=false;$('sourceTrigger').innerHTML='<span>'+esc(path(id))+'</span>'+icon('down');setSourceOpen(false);renderCopy();$('copySearch').focus()}
function alreadyExists(a){return inNode(copyState.target).some(x=>x.originId===a.originId)}
function filteredSource(){return copyState?.source?inNode(copyState.source).filter(a=>matches(a,$('copySearch').value)):[]}
function pageSource(){const list=filteredSource();return list.slice((copyState.page-1)*copyState.size,copyState.page*copyState.size)}
function renderCopy(){if(!copyState)return;const list=filteredSource();copyState.page=Math.max(1,Math.min(copyState.page,Math.ceil(list.length/copyState.size)||1));const rows=pageSource();$('sourceTotal').textContent=copyState.source?`共 ${list.length} 项`:'';
 $('copyTableArea').innerHTML=!copyState.source?empty('请选择来源目录','选择目录后，可勾选需要复制的资产'):!rows.length?empty($('copySearch').value?'没有找到匹配的资产':'该目录暂无资产',$('copySearch').value?'请调整搜索关键词':'请选择其他来源目录'):`<table class="copy-table"><thead><tr><th><input type="checkbox" id="selectPage" aria-label="全选当前页可复制资产" ${rows.every(alreadyExists)?'disabled':''}></th><th class="name-cell">资产名称</th><th class="path-cell">所属目录</th><th class="state-cell">是否上架</th><th class="api-cell">API个数</th><th class="exist-cell"></th></tr></thead><tbody>${rows.map(a=>{const exists=alreadyExists(a);return `<tr class="${exists?'exists':copyState.selected.has(a.id)?'chosen':''}"><td><input type="checkbox" data-check="${a.id}" aria-label="选择资产 ${esc(a.name)}" ${exists?'disabled':''} ${copyState.selected.has(a.id)?'checked':''}></td><td class="ellip" title="${esc(a.name)}">${esc(a.name)}</td><td class="path-cell ellip" title="${esc(path(a.directoryId))}">${esc(path(a.directoryId))}</td><td class="${a.published?'published':'unpublished'}">${a.published?'已上架':'未上架'}</td><td>${a.apis}</td><td class="exist-cell">${exists?'<span class="existing-badge">已存在</span>':''}</td></tr>`}).join('')}</tbody></table>`;
 $('copyPager').innerHTML=copyState.source?pagerHtml(list.length,copyState.page,copyState.size,'copy'):'';const pageCheck=$('selectPage');if(pageCheck){const available=rows.filter(a=>!alreadyExists(a)),n=available.filter(a=>copyState.selected.has(a.id)).length;pageCheck.checked=available.length>0&&n===available.length;pageCheck.indeterminate=n>0&&n<available.length;}$('selectedCount').textContent=copyState.selected.size;$('confirmCopy').disabled=copyState.selected.size===0||copyState.busy;
}
function selectAsset(id,checked){const a=assets.find(x=>x.id===id);if(!a||alreadyExists(a))return;if(checked){if([...copyState.selected].some(key=>assets.find(x=>x.id===key)?.originId===a.originId)){toast('已选择同一来源的资产',true);renderCopy();return;}copyState.selected.add(id)}else copyState.selected.delete(id);renderCopy()}
function copyAssets(){if(!copyState||copyState.busy||!copyState.selected.size)return;copyState.busy=true;$('copyOverlay').querySelector('.dialog-body').inert=true;$('confirmCopy').disabled=true;$('cancelCopy').disabled=true;$('closeCopy').disabled=true;$('confirmCopy').innerHTML='<span class="spinner"></span>正在复制';
 setTimeout(()=>{const chosen=[...copyState.selected].map(id=>assets.find(a=>a.id===id)).filter(Boolean);const created=[];for(const a of chosen){if(alreadyExists(a))continue;const id='copied-'+Date.now()+'-'+created.length;created.push({...a,id,originId:a.originId,directoryId:copyState.target,published:false,publisher:'',publishedAt:'',owner:'管理员',apis:0,copiedFrom:a.id,createdAt:timeNow()})}assets.unshift(...created);currentNode=copyState.target;mainPage=1;$('assetSearch').value='';highlighted=new Set(created.map(a=>a.id));copyState.busy=false;$('copyOverlay').querySelector('.dialog-body').inert=false;$('cancelCopy').disabled=false;$('closeCopy').disabled=false;hideCopy();renderMain();toast(`已复制 ${created.length} 项资产`);$('mainTableArea').scrollTop=0;},450)
}
function timeNow(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}
function showSecondary(title,body,buttons){secondaryReturn=document.activeElement;$('secondaryTitle').textContent=title;$('secondaryBody').innerHTML=body;$('secondaryFoot').innerHTML=buttons;$('secondaryOverlay').hidden=false;document.body.style.overflow='hidden';setTimeout(()=>$('secondaryBody').querySelector('input,select')?.focus(),20)}
function hideSecondary(){$('secondaryOverlay').hidden=true;restoreScroll();secondaryReturn?.focus()}
function showAddNode(){const options='<option value="">一级目录</option>'+nodes.map(n=>`<option value="${n.id}" ${n.id===currentNode?'selected':''}>${esc(path(n.id))}</option>`).join('');showSecondary('新增目录节点',`<div class="form-field"><label for="nodeParent">上级目录</label><select class="input" id="nodeParent">${options}</select></div><div class="form-field"><label for="nodeName">目录名称</label><input class="input" id="nodeName" maxlength="40" placeholder="请输入目录名称"><div class="error" id="nodeError"></div></div>`,'<button class="btn" data-secondary="cancel">取消</button><button class="btn primary" data-secondary="save-node">确定</button>')}
function addNode(){const name=$('nodeName').value.trim(),parent=$('nodeParent').value||null;if(!name){$('nodeError').textContent='请输入目录名称';return}if(nodes.some(n=>n.parent===parent&&n.name===name)){$('nodeError').textContent='同级目录中已存在该名称';return}const id='node-'+Date.now();nodes.push({id,name,parent});if(parent)expanded.add(parent);hideSecondary();selectNode(id);toast('目录节点已添加')}
function showDetails(a){showSecondary('资产详情',`<dl class="detail-list"><dt>资产名称</dt><dd>${esc(a.name)}</dd><dt>所属目录</dt><dd>${esc(path(a.directoryId))}</dd><dt>数据来源</dt><dd>${esc(a.source)}</dd><dt>关联数据表</dt><dd>${esc(a.table)}</dd><dt>是否上架</dt><dd class="${a.published?'':'unpublished'}">${a.published?'已上架':'未上架'}</dd><dt>添加人</dt><dd>${esc(a.owner)}</dd><dt>资产说明</dt><dd>${esc(a.description)}</dd></dl>`,'<button class="btn primary" data-secondary="cancel">关闭</button>')}
function showApi(a){showSecondary('API管理',`<p class="demo-support">现有 API 管理流程不在本次原型的演示范围内。</p><dl class="detail-list"><dt>资产名称</dt><dd>${esc(a.name)}</dd><dt>API个数</dt><dd>${a.apis}</dd></dl>`,'<button class="btn primary" data-secondary="cancel">关闭</button>')}
function showOriginalAdd(){showSecondary('添加资产','<p class="notice">此入口保留现有添加流程。</p><p class="demo-support">本次原型展示资产复制，原有添加表单沿用系统实现。</p>','<button class="btn primary" data-secondary="cancel">关闭</button>')}
function showCatalog(){ $('workspace').hidden=true;$('directoryList').hidden=false;$('pageTitle').textContent='目录配置';$('goBack').style.visibility='hidden';renderCatalog()}
function renderCatalog(){
 const q=$('catalogSearch').value.trim(),rows=catalogs.filter(r=>r.name.includes(q));
 $('catalogRows').innerHTML=rows.length?rows.map(r=>`<tr data-catalog-id="${r.id}"><td>${esc(r.name)}</td><td>${esc(r.module)}</td><td><span style="color:${r.enabled?'#67ad43':'#939da7'}">${r.enabled?'启用':'禁用'}</span></td><td class="catalog-description" title="${esc(r.description)}">${esc(r.description)||'—'}</td><td><div class="ops"><button class="link" data-catalog-action="configure" data-id="${r.id}" ${r.id!=='assets'?'disabled':''}>目录配置</button><button class="link" data-catalog-action="toggle" data-id="${r.id}">${r.enabled?'禁用':'启用'}</button><button class="link" data-catalog-action="edit" data-id="${r.id}">编辑</button><button class="link danger" data-catalog-action="delete" data-id="${r.id}">删除</button></div></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty"><strong>'+ (q?'未找到匹配的目录':'暂无目录') +'</strong></div></td></tr>';
}
function getAssetCatalog(){return catalogs.find(r=>r.id==='assets');}
function assetCatalogName(){return getAssetCatalog()?.name||'资产目录';}
function showCatalogToggle(id){
 const record=catalogs.find(r=>r.id===id);if(!record)return;
 const label=record.enabled?'禁用':'启用';
 showSecondary(label+'目录',`<p class="notice">确定${label}“${esc(record.name)}”吗？</p>`,`<button class="btn" data-secondary="cancel">取消</button><button class="btn primary" data-secondary="catalog-toggle" data-id="${id}">确定${label}</button>`);
}
function showCatalogEdit(id){
 const record=catalogs.find(r=>r.id===id);if(!record)return;
 showSecondary('编辑目录',`<div class="form-field"><label for="catalogEditName">目录名称</label><input class="input" id="catalogEditName" value="${esc(record.name)}" maxlength="40" placeholder="请输入目录名称"><div class="error" id="catalogEditError"></div></div><div class="form-field"><label>所属模块</label><div class="catalog-module">${esc(record.module)}</div></div><div class="form-field"><label for="catalogEditDescription">描述</label><textarea class="input" id="catalogEditDescription" rows="3" maxlength="200" placeholder="请输入目录描述">${esc(record.description)}</textarea></div>`,`<button class="btn" data-secondary="cancel">取消</button><button class="btn primary" data-secondary="catalog-save" data-id="${id}">保存</button>`);
}
function saveCatalogEdit(id){
 const record=catalogs.find(r=>r.id===id);if(!record)return;
 const name=$('catalogEditName').value.trim(),error=!name?'请输入目录名称':catalogs.some(r=>r.id!==id&&r.name===name)?'已存在同名目录，请调整名称':'';
 $('catalogEditError').textContent=error;if(error){$('catalogEditName').focus();return;}
 record.name=name;record.description=$('catalogEditDescription').value.trim();
 hideSecondary();renderCatalog();toast('目录已更新');
}
function showCatalogDelete(id){
 const record=catalogs.find(r=>r.id===id);if(!record)return;
 showSecondary('删除目录',`<p class="notice">确定删除“${esc(record.name)}”吗？</p>`,`<button class="btn" data-secondary="cancel">取消</button><button class="btn danger" data-secondary="catalog-delete" data-id="${id}">确定删除</button>`);
}

function enterAssets(){if(!getAssetCatalog()){showCatalog();return;}$('workspace').hidden=false;$('directoryList').hidden=true;$('pageTitle').textContent=assetCatalogName();$('goBack').style.visibility='visible';renderMain()}
$('mainTree').addEventListener('click',e=>{const t=e.target.closest('[data-toggle]');if(t){expanded.has(t.dataset.toggle)?expanded.delete(t.dataset.toggle):expanded.add(t.dataset.toggle);renderTree();return;}const row=e.target.closest('[data-node]');if(row)selectNode(row.dataset.node)});
$('mainTree').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const row=e.target.closest('[data-node]');if(row){e.preventDefault();selectNode(row.dataset.node)}}});
$('assetSearch').addEventListener('input',()=>{mainPage=1;renderMain()});$('openCopy').addEventListener('click',showCopy);$('closeCopy').addEventListener('click',hideCopy);$('cancelCopy').addEventListener('click',hideCopy);$('confirmCopy').addEventListener('click',copyAssets);
$('sourceTrigger').addEventListener('click',()=>setSourceOpen($('sourcePopover').hidden));$('sourceSearch').addEventListener('input',renderSource);$('sourceOptions').addEventListener('click',e=>{const b=e.target.closest('[data-source]');if(b&&!b.disabled)sourceSelect(b.dataset.source)});
$('copySearch').addEventListener('input',()=>{copyState.page=1;renderCopy()});$('copyTableArea').addEventListener('change',e=>{if(e.target.id==='selectPage'){const checked=e.target.checked;for(const a of pageSource().filter(a=>!alreadyExists(a))){if(checked){if(![...copyState.selected].some(id=>assets.find(x=>x.id===id)?.originId===a.originId))copyState.selected.add(a.id)}else copyState.selected.delete(a.id)}renderCopy()}else if(e.target.dataset.check)selectAsset(e.target.dataset.check,e.target.checked)});
document.addEventListener('click',e=>{if(!e.target.closest('.source-wrap')&&!$('sourcePopover').hidden)setSourceOpen(false);const page=e.target.closest('[data-page]');if(page&&!page.disabled){if(page.dataset.kind==='copy'){copyState.page=+page.dataset.page;renderCopy()}else{mainPage=+page.dataset.page;renderMain()}}});
document.addEventListener('change',e=>{const kind=e.target.dataset.size;if(kind==='copy'){copyState.size=+e.target.value;copyState.page=1;renderCopy()}else if(kind==='main'){mainSize=+e.target.value;mainPage=1;renderMain()}});
$('mainPager').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.jump')){mainPage=Math.max(1,parseInt(e.target.value)||1);renderMain()}});
$('addNode').addEventListener('click',showAddNode);$('closeSecondary').addEventListener('click',hideSecondary);$('secondaryFoot').addEventListener('click',e=>{const action=e.target.dataset.secondary;if(action==='cancel')hideSecondary();if(action==='save-node')addNode();if(action==='delete'){assets=assets.filter(a=>a.id!==e.target.dataset.id);hideSecondary();renderMain();toast('资产已删除')}});
$('secondaryBody').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nodeName')addNode()});
$('mainTableArea').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=assets.find(x=>x.id===b.dataset.id);if(!a)return;if(b.dataset.act==='detail')showDetails(a);if(b.dataset.act==='api')showApi(a);if(b.dataset.act==='publish'){a.published=!a.published;a.publisher=a.published?'管理员':'';a.publishedAt=a.published?timeNow():'';renderMain();toast(a.published?'资产已上架':'资产已下架')}if(b.dataset.act==='delete')showSecondary('删除资产',`<p class="notice">确定删除当前目录中的“${esc(a.name)}”吗？</p>` ,`<button class="btn" data-secondary="cancel">取消</button><button class="btn primary" data-secondary="delete" data-id="${a.id}">确定删除</button>`)});
$('originalAdd').addEventListener('click',showOriginalAdd);$('goBack').addEventListener('click',showCatalog);$('catalogSearch').addEventListener('input',renderCatalog);$('catalogRows').addEventListener('click',e=>{
 const button=e.target.closest('[data-catalog-action]');if(!button||button.disabled)return;
 const id=button.dataset.id,action=button.dataset.catalogAction;
 if(action==='configure'&&id==='assets')enterAssets();
 if(action==='toggle')showCatalogToggle(id);
 if(action==='edit')showCatalogEdit(id);
 if(action==='delete')showCatalogDelete(id);
});
$('secondaryFoot').addEventListener('click',e=>{
 const button=e.target.closest('[data-secondary]');if(!button)return;
 const action=button.dataset.secondary,id=button.dataset.id;
 if(action==='catalog-save')saveCatalogEdit(id);
 if(action==='catalog-toggle'){const record=catalogs.find(r=>r.id===id);if(!record)return;record.enabled=!record.enabled;hideSecondary();renderCatalog();toast(record.enabled?'目录已启用':'目录已禁用');}
 if(action==='catalog-delete'){catalogs=catalogs.filter(r=>r.id!==id);hideSecondary();renderCatalog();toast('目录已删除');}
});
$('resetDemo').addEventListener('click',()=>{resetData();currentNode='infra';mainPage=1;mainSize=10;highlighted.clear();$('assetSearch').value='';resetDirectoryView();showCatalog();toast('演示已重置')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('secondaryOverlay').hidden)hideSecondary();else if(!$('sourcePopover').hidden){setSourceOpen(false);$('sourceTrigger').focus()}else if(!$('copyOverlay').hidden)hideCopy()}if(e.key==='Tab'){const container=!$('secondaryOverlay').hidden?$('secondaryOverlay'):!$('copyOverlay').hidden?$('copyOverlay'):null;if(!container)return;const items=[...container.querySelectorAll('button,input,select,[tabindex="0"]')].filter(x=>!x.disabled&&x.getClientRects().length);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

function renderDirectoryHeading(){
 $('currentDirectoryName').textContent=node(currentNode)?.name||'';
 $('currentDirectoryPath').textContent=path(currentNode);
}
function restoreScroll(){document.body.style.overflow=[...document.querySelectorAll('.overlay')].some(x=>!x.hidden)?'hidden':'';}
function resetDirectoryView(){
 copyState=null;$('copyOverlay').hidden=true;$('secondaryOverlay').hidden=true;
 setSourceOpen(false);$('catalogSearch').value='';restoreScroll();renderMain();
}

resetData();renderMain();showCatalog();
})();
</script>
</body></html>
